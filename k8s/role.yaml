# Kubernetes RBAC — Role (cluster-level resource permissions for the diet-risk namespace).
#
# NOTE: This controls what Kubernetes API operations are allowed (pod/service
# inspection). It is separate from the JWT-based application RBAC that controls
# who can call /predict, /users, etc. Both layers are required: K8s RBAC secures
# the cluster control plane; JWT RBAC secures the application API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diet-risk-read-only
  namespace: diet-risk
  labels:
    app.kubernetes.io/part-of: diet-risk-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
