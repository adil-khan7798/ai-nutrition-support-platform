# Microservice 1 — Intake API
# ClusterIP service fronted by the Ingress in ingress.yaml. The ML API is
# reached over the in-cluster DNS name ml-api on port 8002.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-api
  namespace: diet-risk
  labels:
    app: intake-api
    app.kubernetes.io/part-of: diet-risk-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intake-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: intake-api
    spec:
      containers:
        - name: intake-api
          # Replace <ACR_NAME> with your Azure Container Registry login server.
          image: adilriskacr123.azurecr.io/intake-api:v5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: ML_API_URL
              value: "http://ml-api:8002"
            - name: ML_API_TIMEOUT
              value: "130"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ADMIN_PASSWORD
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: USER_PASSWORD
            - name: SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: SERVICE_PASSWORD
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: intake-api
  namespace: diet-risk
  labels:
    app: intake-api
spec:
  type: ClusterIP
  selector:
    app: intake-api
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
