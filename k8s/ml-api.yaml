# Microservice 2 — ML API
# Internal-only ClusterIP service. Reached by intake-api at http://ml-api:8002.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
  namespace: diet-risk
  labels:
    app: ml-api
    app.kubernetes.io/part-of: diet-risk-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      containers:
        - name: ml-api
          # Replace <ACR_NAME> with your Azure Container Registry login server,
          # e.g. myregistry.azurecr.io
          image: adilriskacr123.azurecr.io/ml-api:v4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET_KEY
            - name: DATABRICKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DATABRICKS_TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ml-api
  namespace: diet-risk
  labels:
    app: ml-api
spec:
  type: ClusterIP
  selector:
    app: ml-api
  ports:
    - name: http
      port: 8002
      targetPort: http
      protocol: TCP
