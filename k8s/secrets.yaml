# secrets.yaml — TEMPLATE ONLY. Do NOT commit real values to git.
#
# Create the secret with kubectl instead of applying this file:
#
#   kubectl create secret generic api-secret \
#     --namespace diet-risk \
#     --from-literal=JWT_SECRET_KEY="<replace-with-64-char-random-string>" \
#     --from-literal=ADMIN_PASSWORD="<replace-with-strong-password>" \
#     --from-literal=USER_PASSWORD="<replace-with-strong-password>" \
#     --from-literal=SERVICE_PASSWORD="<replace-with-strong-password>" \
#     --from-literal=DATABRICKS_TOKEN="<replace-with-databricks-pat>"
#
# To generate a strong JWT_SECRET_KEY locally:
#   python -c "import secrets; print(secrets.token_hex(32))"
#
# DATABRICKS_TOKEN: a Databricks Personal Access Token (PAT) scoped to the
# Model Serving endpoint. Generate one in the Databricks workspace under
# User Settings > Developer > Access Tokens.
#
# This file is kept for documentation only. The actual secret lives in AKS
# and is never stored in source control.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: diet-risk
type: Opaque
stringData:
  JWT_SECRET_KEY: REPLACE_WITH_STRONG_SECRET
  ADMIN_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
  USER_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
  SERVICE_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
  DATABRICKS_TOKEN: REPLACE_WITH_DATABRICKS_PAT
